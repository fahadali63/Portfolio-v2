# Netlify: build the static site. public/media is committed (it holds the redacted, web-ready images).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Pages from the previous site now live as sections of the home page.
[[redirects]]
  from = "/urban-planning"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/business-development"
  to = "/#results"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
